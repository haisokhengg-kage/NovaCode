{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaCode</title>

    <link rel="icon" href="{% static 'images/NovaCode.jpg' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    
</head>

<body>
    
    <!-- NovaCode Mascot -->
    <div id="mascot"
        class="fixed top-[150px] left-[50px] w-[120px] z-[999999]
            cursor-grab select-none touch-none">

        <div id="mascotWord"
        class="absolute -top-10 left-1/2 -translate-x-1/2
                whitespace-nowrap rounded-xl bg-blue-500
                px-3 py-1 text-sm font-bold text-white
                shadow-lg transition-all duration-300">
        Hello! oni-chan👋
        </div>
        <div id="mascotBubble"
            class="absolute bottom-full left-1/2 -translate-x-1/2">
        </div>

        <img
            id="mascotImg"
            src="{% static 'images/HappyDanceSticker.gif' %}"
            alt="NovaCode Mascot"
            class="w-full h-auto block pointer-events-none select-none"
            draggable="false"
        >
        <div
        class="absolute -top1 left-1/2 -translate-x-1/2
                whitespace-nowrap rounded-xl border border-sky-400/30
                bg-blue-500/20 backdrop-blur-2xl
                px-3 py-1 text-sm font-bold text-white
                shadow-lg transition-all duration-300
                ml-15">
        💖😻 HAPPY
        </div>

        <span id="mascotBadge"
            class="absolute top-0 right-0">
        </span>
        

    </div>

<script defer src="{% static 'js/script.js' %}"></script>
</body>
</html>
